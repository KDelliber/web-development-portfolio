<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="description" content="Neon Ruins, a top-down sci-fi adventure prototype with keyboard and touch controls."><title>Neon Ruins</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050713;color:#eef7ff;font-family:Inter,system-ui,sans-serif;min-height:100%;overflow-x:hidden}body{padding:10px;background:radial-gradient(circle at 20% 10%,rgba(60,255,240,.08),transparent 30%),radial-gradient(circle at 85% 80%,rgba(179,94,255,.10),transparent 30%),#050713}.wrap{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:4px 0 8px}.title h1{margin:0;font-size:clamp(2rem,7vw,4rem);letter-spacing:-.04em;text-shadow:0 0 24px #67f8ff55}.title p{margin:4px 0 0;color:#9ab1ca}.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:8px 10px;border:1px solid #294c78;border-radius:12px;background:#0c1630cc;min-width:88px;text-align:center}.pill b{display:block;font-size:1.05rem}.pill span{font-size:.68rem;color:#8fa8c4;text-transform:uppercase;letter-spacing:.12em}.game-shell{position:relative;border:1px solid #28547d;border-radius:18px;padding:8px;background:linear-gradient(145deg,#0b1326,#07101e);box-shadow:0 24px 70px #0008,0 0 30px #5de9ff14}.viewport{position:relative;overflow:hidden;border-radius:12px;aspect-ratio:16/10;background:#06101b;touch-action:none}.world{position:absolute;left:0;top:0;width:1600px;height:1000px;background:radial-gradient(circle at 76% 30%,rgba(129,59,190,.18),transparent 26%),radial-gradient(circle at 30% 70%,rgba(59,205,216,.12),transparent 25%),repeating-linear-gradient(0deg,#0b1724 0 39px,#0d1d2c 40px),repeating-linear-gradient(90deg,transparent 0 39px,#122337 40px)}.ruin,.wall,.gate,.core,.drone,.npc,.player,.exit{position:absolute}.wall{background:linear-gradient(145deg,#182538,#0f1b29);border:1px solid #263d56;box-shadow:inset 0 0 18px #0008}.ruin{border:1px solid #1f5b66;background:#0b1c24cc;box-shadow:0 0 18px #41e9ff15}.gate{width:34px;background:linear-gradient(#182338,#3d2454);border:1px solid #9c65d8;box-shadow:0 0 18px #b56cff66}.gate.open{opacity:.18;box-shadow:none}.core{width:22px;height:22px;border-radius:50%;background:#7dfcff;box-shadow:0 0 8px #7dfcff,0 0 26px #7dfcff;animation:pulse 1.5s ease-in-out infinite}.core:after{content:"";position:absolute;inset:-8px;border:1px solid #7dfcff55;border-radius:50%}.npc{width:28px;height:36px;border-radius:10px;background:linear-gradient(#ffd166,#a46b17);box-shadow:0 0 18px #ffd16655}.drone{width:28px;height:28px;border-radius:50%;background:#ff5d73;border:3px solid #461926;box-shadow:0 0 18px #ff5d7355}.drone:after{content:"";position:absolute;left:8px;top:8px;width:6px;height:6px;border-radius:50%;background:white;box-shadow:0 0 8px white}.player{width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,#8af7ff,#3487ff);box-shadow:0 0 16px #64e9ff88;z-index:5}.player:after{content:"";position:absolute;left:9px;top:5px;width:10px;height:6px;border-radius:5px;background:#eaffff}.exit{width:54px;height:54px;border-radius:50%;border:3px solid #64f4ff;box-shadow:0 0 24px #64f4ff88,inset 0 0 22px #64f4ff44;background:#0a2b33}.exit.locked{border-color:#5d6f80;box-shadow:none;opacity:.5}.msg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(88%,560px);padding:10px 14px;border-radius:12px;background:#06111de8;border:1px solid #27577a;color:#dbeeff;text-align:center;font-size:.9rem;opacity:0;transition:.2s;pointer-events:none}.msg.show{opacity:1}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:12px auto 0}.btn{min-height:52px;border:1px solid #355d91;border-radius:14px;background:linear-gradient(#17274c,#101a33);color:#eefbff;font-weight:900;font-size:1.1rem;touch-action:none;user-select:none}.btn.action{background:linear-gradient(#533069,#2a183a);border-color:#8d57ad}.legend{text-align:center;color:#8ea5be;font-size:.8rem;margin:10px 0}.back{display:inline-block;margin:4px 0 12px;color:#a8e8ff;text-decoration:none;font-weight:700}@keyframes pulse{50%{transform:scale(1.18);filter:brightness(1.25)}}@media(max-width:680px){body{padding:6px}.top{align-items:flex-start}.hud{gap:5px}.pill{min-width:68px;padding:6px}.title p{font-size:.78rem}.game-shell{padding:5px;border-radius:14px}.controls{gap:6px}.btn{min-height:50px;font-size:1rem}.legend{font-size:.72rem}}</style></head><body><main class="wrap"><div class="top"><div class="title"><h1>NEON RUINS</h1><p>Restore power. Survive the drones. Open the way.</p></div><div class="hud"><div class="pill"><span>Health</span><b id="health">100</b></div><div class="pill"><span>Cores</span><b id="cores">0 / 3</b></div><div class="pill"><span>Objective</span><b id="obj">Explore</b></div></div></div><div class="game-shell"><div class="viewport" id="viewport"><div class="world" id="world"><div class="wall" style="left:0;top:0;width:1600px;height:34px"></div><div class="wall" style="left:0;top:966px;width:1600px;height:34px"></div><div class="wall" style="left:0;top:0;width:34px;height:1000px"></div><div class="wall" style="left:1566px;top:0;width:34px;height:1000px"></div><div class="wall" style="left:290px;top:180px;width:360px;height:48px"></div><div class="wall" style="left:290px;top:180px;width:48px;height:310px"></div><div class="wall" style="left:610px;top:180px;width:40px;height:310px"></div><div class="wall" style="left:290px;top:450px;width:140px;height:40px"></div><div class="wall" style="left:510px;top:450px;width:140px;height:40px"></div><div class="gate" id="gate" style="left:430px;top:450px;height:40px"></div><div class="wall" style="left:850px;top:90px;width:50px;height:450px"></div><div class="wall" style="left:850px;top:500px;width:330px;height:40px"></div><div class="wall" style="left:1140px;top:500px;width:40px;height:290px"></div><div class="wall" style="left:1040px;top:750px;width:140px;height:40px"></div><div class="ruin" style="left:70px;top:650px;width:250px;height:220px"></div><div class="ruin" style="left:1270px;top:150px;width:210px;height:180px"></div><div class="core" data-core style="left:525px;top:300px"></div><div class="core" data-core style="left:1010px;top:270px"></div><div class="core" data-core style="left:1370px;top:730px"></div><div class="npc" id="npc" style="left:175px;top:720px"></div><div class="drone" data-drone style="left:760px;top:300px"></div><div class="drone" data-drone style="left:990px;top:650px"></div><div class="drone" data-drone style="left:1340px;top:410px"></div><div class="exit locked" id="exit" style="left:1450px;top:850px"></div><div class="player" id="player" style="left:90px;top:90px"></div></div><div class="msg" id="msg"></div></div></div><div class="controls"><button class="btn" data-dir="left">◀</button><button class="btn" data-dir="up">▲</button><button class="btn action" id="action">ACT</button><button class="btn" data-dir="down">▼</button><button class="btn" data-dir="right">▶</button></div><div class="legend">PC: WASD / Arrow Keys to move · E or Space to interact/strike · Mobile: use the controls above</div><a class="back" href="games.html">← Back to Portfolio Arcade</a></main><script>(()=>{const world=document.getElementById('world'),view=document.getElementById('viewport'),p=document.getElementById('player'),msg=document.getElementById('msg'),gate=document.getElementById('gate'),exit=document.getElementById('exit'),healthEl=document.getElementById('health'),coresEl=document.getElementById('cores'),objEl=document.getElementById('obj');let x=90,y=90,health=100,cores=0,won=false,lastHit=0;const speed=4.2,keys={};const walls=[...document.querySelectorAll('.wall'),gate];const drones=[...document.querySelectorAll('[data-drone]')].map(el=>({el,x:parseFloat(el.style.left),y:parseFloat(el.style.top),hp:2}));function box(nx,ny){return{x:nx,y:ny,w:28,h:28}}function rect(el){return{x:parseFloat(el.style.left),y:parseFloat(el.style.top),w:parseFloat(el.style.width)||el.offsetWidth,h:parseFloat(el.style.height)||el.offsetHeight}}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function blocked(nx,ny){const b=box(nx,ny);return walls.some(w=>w===gate&&gate.classList.contains('open')?false:hit(b,rect(w)))}function say(t){msg.textContent=t;msg.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>msg.classList.remove('show'),2200)}function collect(){document.querySelectorAll('[data-core]').forEach(c=>{if(c.style.display==='none')return;if(hit(box(x,y),rect(c))){c.style.display='none';cores++;coresEl.textContent=cores+' / 3';say('Energy core secured.');if(cores===3){gate.classList.add('open');exit.classList.remove('locked');objEl.textContent='Reach Gate';say('All cores online. Eastern gate unlocked.')}}})}function act(){let closeNpc=Math.hypot(x-175,y-720)<70;if(closeNpc){say(cores<3?'Mara: Three cores will restore the eastern transit gate. Watch the drones.':'Mara: Power is back. The transit ring should be active.');return}for(const d of drones){if(d.hp>0&&Math.hypot(x-d.x,y-d.y)<65){d.hp--;d.el.style.transform='scale(.75)';setTimeout(()=>d.el.style.transform='',120);if(d.hp<=0){d.el.style.display='none';say('Drone disabled.')}return}}if(cores===3&&Math.hypot(x-1450,y-850)<78){won=true;objEl.textContent='Complete';say('SECTOR RESTORED // Prototype complete');exit.style.boxShadow='0 0 40px #64f4ff, inset 0 0 24px #64f4ff';return}say('Nothing to interact with here.')}function move(dx,dy){if(won)return;let nx=x+dx*speed,ny=y+dy*speed;if(!blocked(nx,y))x=nx;if(!blocked(x,ny))y=ny;p.style.left=x+'px';p.style.top=y+'px';collect()}function updateDrones(){const now=performance.now();for(const d of drones){if(d.hp<=0)continue;let dist=Math.hypot(x-d.x,y-d.y);if(dist<280){let dx=(x-d.x)/dist,dy=(y-d.y)/dist,spd=1.25;let nx=d.x+dx*spd,ny=d.y+dy*spd;if(!blocked(nx,ny)){d.x=nx;d.y=ny;d.el.style.left=d.x+'px';d.el.style.top=d.y+'px'}if(dist<33&&now-lastHit>900){health=Math.max(0,health-15);healthEl.textContent=health;lastHit=now;p.style.filter='brightness(2)';setTimeout(()=>p.style.filter='',120);if(health<=0){health=100;healthEl.textContent=100;x=90;y=90;p.style.left=x+'px';p.style.top=y+'px';say('Suit rebooted at the sector entrance.')}}}}}function camera(){let vw=view.clientWidth,vh=view.clientHeight;let cx=Math.max(0,Math.min(1600-vw,x-vw/2)),cy=Math.max(0,Math.min(1000-vh,y-vh/2));world.style.transform=`translate(${-cx}px,${-cy}px)`}function loop(){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){let n=Math.hypot(dx,dy);move(dx/n,dy/n)}updateDrones();camera();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};if(m[k]){keys[m[k]]=true;e.preventDefault()}if(k==='e'||e.code==='Space'){e.preventDefault();act()}});document.addEventListener('keyup',e=>{const k=e.key.toLowerCase(),m={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};if(m[k])keys[m[k]]=false});document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[d]=true;b.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>keys[d]=false))});document.getElementById('action').addEventListener('pointerdown',e=>{e.preventDefault();act()});say('Find the three energy cores. Mara is in the southwest ruins.');loop()})();</script></body></html>
