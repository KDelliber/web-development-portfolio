<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Tetris</title>

<style>
    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin-bottom: 5px;
    }

    #score {
        font-size: 20px;
        margin-bottom: 10px;
    }

#game {
    border: 3px solid white;
    background: #000;
    height: calc(100vh - 230px);
    width: auto;
}
#gameArea {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 20px;
}

#nextArea {
    font-size: 20px;
    font-weight: bold;
}

#next {
    width: 120px;
    height: 120px;
    border: 3px solid white;
    background: #000;
    margin-top: 5px;
}

#holdArea {
    font-size: 20px;
    font-weight: bold;
}

#hold {
    width: 120px;
    height: 120px;
    border: 3px solid white;
    background: #000;
    margin-top: 5px;
}
    #controls {
        margin-top: 10px;
        color: #bbb;
    }

    button {
        margin-top: 12px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
</style>
</head>

<body>

<h1>TETRIS</h1>

<div id="score">Score: 0</div>

<div id="gameArea">
<div id="holdArea">
    <div>HOLD</div>
    <canvas id="hold" width="120" height="120"></canvas>
</div>
    <canvas id="game" width="300" height="600"></canvas>

    <div id="nextArea">
        <div>NEXT</div>
        <canvas id="next" width="120" height="120"></canvas>
    </div>
</div>
<br>

<button onclick="restartGame()">Restart</button>

<div id="controls">
    ← → Move &nbsp; | &nbsp;
	A/D Rotate &nbsp; | &nbsp;
	W Hold &nbsp; | &nbsp;
    ↓ Drop &nbsp; | &nbsp;
    Space Hard Drop
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextCanvas = document.getElementById("next");
const nextCtx = nextCanvas.getContext("2d");
const holdCanvas = document.getElementById("hold");
const holdCtx = holdCanvas.getContext("2d");
const COLS = 10;
const ROWS = 20;
const BLOCK = 30;

let score = 0;
let gameOver = false;

const colors = [
    null,
    "#00ffff",
    "#0000ff",
    "#ff8800",
    "#ffff00",
    "#00ff00",
    "#aa00ff",
    "#ff0000"
];

const pieces = [
    [
        [1,1,1,1]
    ],

    [
        [2,0,0],
        [2,2,2]
    ],

    [
        [0,0,3],
        [3,3,3]
    ],

    [
        [4,4],
        [4,4]
    ],

    [
        [0,5,5],
        [5,5,0]
    ],

    [
        [0,6,0],
        [6,6,6]
    ],

    [
        [7,7,0],
        [0,7,7]
    ]
];

function createBoard() {
    return Array.from(
        { length: ROWS },
        () => Array(COLS).fill(0)
    );
}

let board = createBoard();

let player = {
    matrix: null,
    x: 0,
    y: 0
};
let nextType = Math.floor(Math.random() * pieces.length);
let currentType = null;
let holdType = null;
let canHold = true;
function newPiece() {

    const type = nextType;
	currentType = type;
	canHold = true;
    nextType = Math.floor(Math.random() * pieces.length);

    player.matrix = pieces[type].map(row => [...row]);

    player.y = 0;

    player.x =
        Math.floor(COLS / 2) -
        Math.floor(player.matrix[0].length / 2);

    drawNextPiece();

    if (collision()) {
        gameOver = true;
    }
}
function drawNextPiece() {

    nextCtx.fillStyle = "#000";
    nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

    const matrix = pieces[nextType];
    const previewBlock = 25;

    const pieceWidth = matrix[0].length * previewBlock;
    const pieceHeight = matrix.length * previewBlock;

    const offsetX = (nextCanvas.width - pieceWidth) / 2;
    const offsetY = (nextCanvas.height - pieceHeight) / 2;

    matrix.forEach((row, y) => {
        row.forEach((value, x) => {

            if (value) {
                nextCtx.fillStyle = colors[value];

                nextCtx.fillRect(
                    offsetX + x * previewBlock,
                    offsetY + y * previewBlock,
                    previewBlock,
                    previewBlock
                );

                nextCtx.strokeStyle = "#222";

                nextCtx.strokeRect(
                    offsetX + x * previewBlock,
                    offsetY + y * previewBlock,
                    previewBlock,
                    previewBlock
                );
            }
        });
    });
}

function holdPiece() {
    if (!canHold) return;

    canHold = false;

    if (holdType === null) {
        holdType = currentType;
        currentType = nextType;
        nextType = Math.floor(Math.random() * pieces.length);
    } else {
        const temp = currentType;
        currentType = holdType;
        holdType = temp;
    }

    player.matrix = pieces[currentType].map(row => [...row]);

    player.y = 0;

    player.x =
        Math.floor(COLS / 2) -
        Math.floor(player.matrix[0].length / 2);

    drawNextPiece();
    drawHoldPiece();
}

function drawHoldPiece() {
    holdCtx.fillStyle = "#000";
    holdCtx.fillRect(0, 0, holdCanvas.width, holdCanvas.height);

    if (holdType === null) return;

    const matrix = pieces[holdType];
    const previewBlock = 25;

    const pieceWidth = matrix[0].length * previewBlock;
    const pieceHeight = matrix.length * previewBlock;

    const offsetX = (holdCanvas.width - pieceWidth) / 2;
    const offsetY = (holdCanvas.height - pieceHeight) / 2;

    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value) {
                holdCtx.fillStyle = colors[value];

                holdCtx.fillRect(
                    offsetX + x * previewBlock,
                    offsetY + y * previewBlock,
                    previewBlock,
                    previewBlock
                );

                holdCtx.strokeStyle = "#222";
                holdCtx.strokeRect(
                    offsetX + x * previewBlock,
                    offsetY + y * previewBlock,
                    previewBlock,
                    previewBlock
                );
            }
        });
    });
}

function drawBlock(x, y, value) {

    ctx.fillStyle = colors[value];

    ctx.fillRect(
        x * BLOCK,
        y * BLOCK,
        BLOCK,
        BLOCK
    );

    ctx.strokeStyle = "#222";

    ctx.strokeRect(
        x * BLOCK,
        y * BLOCK,
        BLOCK,
        BLOCK
    );
}

function draw() {

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            if (board[y][x]) {

                drawBlock(
                    x,
                    y,
                    board[y][x]
                );
            }
        }
    }

    if (!gameOver && player.matrix) {

        player.matrix.forEach(
            (row, y) => {

                row.forEach(
                    (value, x) => {

                        if (value) {

                            drawBlock(
                                player.x + x,
                                player.y + y,
                                value
                            );
                        }
                    }
                );
            }
        );
    }

    if (gameOver) {

        ctx.fillStyle = "rgba(0,0,0,.75)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle = "white";
        ctx.font = "32px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            "GAME OVER",
            canvas.width / 2,
            canvas.height / 2
        );
    }
}

function collision() {

    const matrix = player.matrix;

    for (let y = 0; y < matrix.length; y++) {

        for (let x = 0; x < matrix[y].length; x++) {

            if (!matrix[y][x]) continue;

            const newX = player.x + x;
            const newY = player.y + y;

            if (
                newX < 0 ||
                newX >= COLS ||
                newY >= ROWS
            ) {
                return true;
            }

            if (
                newY >= 0 &&
                board[newY][newX]
            ) {
                return true;
            }
        }
    }

    return false;
}

function mergePiece() {

    player.matrix.forEach(
        (row, y) => {

            row.forEach(
                (value, x) => {

                    if (value) {

                        board[
                            player.y + y
                        ][
                            player.x + x
                        ] = value;
                    }
                }
            );
        }
    );
}

function clearLines() {

    let lines = 0;

    outer:
    for (let y = ROWS - 1; y >= 0; y--) {

        for (let x = 0; x < COLS; x++) {

            if (board[y][x] === 0) {

                continue outer;
            }
        }

        board.splice(y, 1);

        board.unshift(
            Array(COLS).fill(0)
        );

        y++;

        lines++;
    }

    if (lines > 0) {

        const points = [
            0,
            100,
            300,
            500,
            800
        ];

        score += points[lines];

        document.getElementById("score").innerText =
            "Score: " + score;
    }
}

function drop() {

    player.y++;

    if (collision()) {

        player.y--;

        mergePiece();

        clearLines();

        newPiece();
    }
}

function hardDrop() {

    while (!collision()) {

        player.y++;
    }

    player.y--;

    mergePiece();

    clearLines();

    newPiece();
}

function move(direction) {

    player.x += direction;

    if (collision()) {

        player.x -= direction;
    }
}

function rotate() {

    const oldMatrix = player.matrix;

    const rotated =
        oldMatrix[0].map(
            (_, index) =>
                oldMatrix.map(
                    row => row[index]
                ).reverse()
        );

    player.matrix = rotated;

    if (collision()) {

        player.matrix = oldMatrix;
    }
}

function rotateLeft() {

    const oldMatrix = player.matrix;

    const rotated =
        oldMatrix[0].map(
            (_, index) =>
                oldMatrix.map(
                    row => row[row.length - 1 - index]
                )
        );

    player.matrix = rotated;

    if (collision()) {
        player.matrix = oldMatrix;
    }
}

document.addEventListener(
    "keydown",
    event => {

        if (gameOver) return;

		if (
		event.key === "ArrowLeft" ||
		event.key === "ArrowRight" ||
		event.key === "ArrowDown" ||
		event.key === "ArrowUp"
) {
    event.preventDefault();
}

        if (event.key === "ArrowLeft") {
            move(-1);
        }

        else if (event.key === "ArrowRight") {
            move(1);
        }

        else if (event.key === "ArrowDown") {
            drop();
        }

      else if (event.key.toLowerCase() === "d") {
    rotate();
}

else if (event.key.toLowerCase() === "a") {
    rotateLeft();
}
else if (event.key.toLowerCase() === "w") {
    holdPiece();
}
        else if (event.code === "Space") {

            event.preventDefault();

            hardDrop();
        }

        draw();
    }
);

let lastDrop = 0;
let dropInterval = 700;

function update(time = 0) {

    if (!gameOver) {

        if (
            time - lastDrop >
            dropInterval
        ) {

            drop();

            lastDrop = time;
        }
    }

    draw();

    requestAnimationFrame(update);
}

function restartGame() {

    board = createBoard();

    score = 0;

    gameOver = false;

    document.getElementById("score").innerText =
        "Score: 0";

    newPiece();
}

newPiece();

update();

</script>

</body>
</html>
