<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakout</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
    }

    #gameCanvas {
      background: #000;
      border: 3px solid white;
      display: block;
      margin: 0 auto;
    }

    #info {
      margin-top: 10px;
      font-size: 18px;
    }

    #controls {
      margin-top: 8px;
      color: #bbb;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>BREAKOUT</h1>

 <canvas id="gameCanvas" width="600" height="500" style="cursor: none;"></canvas>

  <div id="info">
    Score: <span id="score">0</span>
    &nbsp;&nbsp;
    Lives: <span id="lives">3</span>
  </div>

  <div id="controls">
    A / D or Arrow Keys = Move &nbsp; | &nbsp; Space = Start
  </div>

  <p style="color: #bbb; font-size: 12px;">&copy; 2026 Kenneth Delliber. All rights reserved.</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const livesText = document.getElementById("lives");

    let score = 0;
    let lives = 3;
    let gameStarted = false;
    let gameOver = false;

    const paddle = {
      width: 100,
      height: 15,
      x: canvas.width / 2 - 50,
      y: canvas.height - 35,
      speed: 7
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 55,
      radius: 8,
      dx: 4,
      dy: -4
    };

    let leftPressed = false;
    let rightPressed = false;

    const brickRows = 5;
    const brickColumns = 8;
    const brickWidth = 62;
    const brickHeight = 20;
    const brickPadding = 8;
    const brickOffsetTop = 50;
    const brickOffsetLeft = 22;

    let bricks = [];

    function createBricks() {
      bricks = [];

      for (let row = 0; row < brickRows; row++) {
        bricks[row] = [];

        for (let col = 0; col < brickColumns; col++) {
          bricks[row][col] = {
            x: 0,
            y: 0,
            alive: true
          };
        }
      }
    }

    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 55;
      ball.dx = 4;
      ball.dy = -4;

      paddle.x = canvas.width / 2 - paddle.width / 2;

      gameStarted = false;
    }

    function restartGame() {
      score = 0;
      lives = 3;
      gameOver = false;

      scoreText.textContent = score;
      livesText.textContent = lives;

      createBricks();
      resetBall();
    }

    function drawPaddle() {
      ctx.fillStyle = "white";
      ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
      );
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "white";
      ctx.fill();
      ctx.closePath();
    }

    function drawBricks() {
      const colors = [
        "#ff4d4d",
        "#ff9933",
        "#ffff4d",
        "#4dff4d",
        "#4da6ff"
      ];

      for (let row = 0; row < brickRows; row++) {
        for (let col = 0; col < brickColumns; col++) {

          const brick = bricks[row][col];

          if (brick.alive) {
            const brickX =
              col * (brickWidth + brickPadding) +
              brickOffsetLeft;

            const brickY =
              row * (brickHeight + brickPadding) +
              brickOffsetTop;

            brick.x = brickX;
            brick.y = brickY;

            ctx.fillStyle = colors[row];

            ctx.fillRect(
              brickX,
              brickY,
              brickWidth,
              brickHeight
            );
          }
        }
      }
    }

    function collisionDetection() {
      for (let row = 0; row < brickRows; row++) {
        for (let col = 0; col < brickColumns; col++) {

          const brick = bricks[row][col];

          if (!brick.alive) {
            continue;
          }

          if (
            ball.x + ball.radius > brick.x &&
            ball.x - ball.radius < brick.x + brickWidth &&
            ball.y + ball.radius > brick.y &&
            ball.y - ball.radius < brick.y + brickHeight
          ) {
            ball.dy *= -1;

            brick.alive = false;

            score++;

            scoreText.textContent = score;

            if (score === brickRows * brickColumns) {
              gameOver = true;
            }

            return;
          }
        }
      }
    }

    function movePaddle() {
      if (leftPressed) {
        paddle.x -= paddle.speed;
      }

      if (rightPressed) {
        paddle.x += paddle.speed;
      }

      if (paddle.x < 0) {
        paddle.x = 0;
      }

      if (paddle.x + paddle.width > canvas.width) {
        paddle.x = canvas.width - paddle.width;
      }
    }

    function moveBall() {
      ball.x += ball.dx;
      ball.y += ball.dy;

      if (
        ball.x + ball.radius >= canvas.width ||
        ball.x - ball.radius <= 0
      ) {
        ball.dx *= -1;
      }

      if (ball.y - ball.radius <= 0) {
        ball.dy *= -1;
      }

      if (
        ball.dy > 0 &&
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <= paddle.y + paddle.height &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.width
      ) {
        ball.dy = -Math.abs(ball.dy);

        const hitPosition =
          (ball.x - paddle.x) / paddle.width;

        ball.dx = (hitPosition - 0.5) * 10;
      }

      if (ball.y - ball.radius > canvas.height) {
        lives--;

        livesText.textContent = lives;

        if (lives <= 0) {
          gameOver = true;
        } else {
          resetBall();
        }
      }
    }

    function drawMessage(text, subtext) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "white";
      ctx.textAlign = "center";

      ctx.font = "40px Arial";
      ctx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
      );

      ctx.font = "20px Arial";
      ctx.fillText(
        subtext,
        canvas.width / 2,
        canvas.height / 2 + 40
      );
    }

    function draw() {
      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawBricks();
      drawPaddle();
      drawBall();

      movePaddle();

      if (gameStarted && !gameOver) {
        moveBall();
        collisionDetection();
      }

      if (!gameStarted && !gameOver) {
        drawMessage(
          "BREAKOUT",
          "Press SPACE to start"
        );
      }

      if (gameOver) {
        if (score === brickRows * brickColumns) {
          drawMessage(
            "YOU WIN!",
            "Press SPACE to play again"
          );
        } else {
          drawMessage(
            "GAME OVER",
            "Press SPACE to play again"
          );
        }
      }

      requestAnimationFrame(draw);
    }

    document.addEventListener("keydown", function(event) {

      if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
      ) {
        leftPressed = true;
      }

      if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
      ) {
        rightPressed = true;
      }

      if (event.code === "Space") {
        event.preventDefault();

        if (gameOver) {
          restartGame();
          gameStarted = true;
        } else {
          gameStarted = true;
        }
      }
    });

    document.addEventListener("keyup", function(event) {

      if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
      ) {
        leftPressed = false;
      }

      if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
      ) {
        rightPressed = false;
      }
    });

    createBricks();
    draw();
  </script>

</body>
</html>
