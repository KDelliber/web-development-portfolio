n:absolute;left:0;top:0;width:1600px;height:1000px;background:radial-gradient(circle at 78% 24%,rgba(144,45,224,.20),transparent 22%),radial-gradient(circle at 25% 72%,rgba(0,205,220,.12),transparent 24%),linear-gradient(135deg,#07101a 0%,#060a12 45%,#090719 100%)}.world:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(111,159,188,.035) 0 1px,transparent 1px 42px),repeating-linear-gradient(90deg,rgba(111,159,188,.035) 0 1px,transparent 1px 42px),radial-gradient(circle at 15% 20%,#48217a33 0 2px,transparent 3px),radial-gradient(circle at 65% 45%,#00eaff25 0 1px,transparent 2px);background-size:auto,auto,130px 130px,180px 180px;pointer-events:none}.world:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 140px #000;pointer-events:none}.wall,.ruin,.gate,.core,.alien,.npc,.player,.exit,.spore,.pillar{position:absolute}.wall{background:linear-gradient(145deg,#18212c 0%,#0a1119 46%,#131821 100%);border:1px solid #2a3a48;box-shadow:inset 0 0 20px #000b,0 0 14px #0008}.wall:after{content:"";position:absolute;inset:5px;border:1px solid rgba(76,156,184,.12);background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(83,128,147,.08) 47px 48px)}.ruin{border:1px solid #264151;background:linear-gradient(145deg,#0d1820dd,#0a1118ee);box-shadow:inset 0 0 34px #000a,0 0 26px #4be7ff0c}.ruin:before{content:"";position:absolute;inset:12px;border:1px solid #392b5d66;box-shadow:inset 0 0 18px #6129a322}.ruin:after{content:"";position:absolute;left:14%;right:14%;top:46%;height:4px;background:#5a37a2;box-shadow:0 0 12px #a04cff77}.pillar{width:24px;height:90px;background:linear-gradient(90deg,#10131c,#252033,#0f141c);border:1px solid #344250;box-shadow:0 0 12px #000}.pillar:before{content:"";position:absolute;left:5px;right:5px;top:14px;height:4px;background:#22d9ff;box-shadow:0 0 10px #22d9ff88}.gate{width:34px;background:linear-gradient(90deg,#141925,#2a1f45,#141925);border:1px solid #9f65dd;box-shadow:0 0 20px #b56cff88,inset 0 0 16px #8a3cff55}.gate:after{content:"";position:absolute;left:8px;right:8px;top:3px;bottom:3px;background:repeating-linear-gradient(0deg,#c35cffcc 0 3px,transparent 4px 9px);filter:blur(.2px)}.gate.open{opacity:.16;box-shadow:none}.gate.open:after{display:none}.core{width:24px;height:24px;border-radius:6px;transform:rotate(45deg);background:linear-gradient(145deg,#bfffff,#48dbff 55%,#6d4cff);box-shadow:0 0 8px #7dfcff,0 0 28px #5fcfff,0 0 44px #8e55ff99;animation:pulse 1.5s ease-in-out infinite}.core:after{content:"";position:absolute;inset:-9px;border:1px solid #7dfcff66;border-radius:50%;transform:rotate(-45deg)}.spore{width:18px;height:18px;border-radius:50% 45% 50% 35%;background:#66ff8d;box-shadow:0 0 10px #47ff7a,0 0 24px #30ff6577}.spore:before,.spore:after{content:"";position:absolute;width:6px;height:16px;border-radius:50%;background:#6dff9a88;top:11px}.spore:before{left:-4px;transform:rotate(30deg)}.spore:after{right:-4px;transform:rotate(-30deg)}.npc{width:30px;height:40px;border-radius:12px 12px 8px 8px;background:linear-gradient(#d3a85f,#7c5424);box-shadow:0 0 18px #ffcf7355}.npc:before{content:"";position:absolute;left:7px;top:-6px;width:16px;height:12px;border-radius:50% 50% 40% 40%;background:#161c22;border:2px solid #72644c}.npc:after{content:"";position:absolute;left:9px;top:-2px;width:12px;height:3px;border-radius:4px;background:#ffd166;box-shadow:0 0 8px #ffd166}.alien{width:38px;height:30px;z-index:4;filter:drop-shadow(0 0 8px rgba(93,255,132,.24))}.alien .body{position:absolute;left:5px;top:4px;width:28px;height:22px;border-radius:48% 44% 40% 46%;background:radial-gradient(circle at 60% 35%,#b6ff79 0 2px,#35583a 3px 7px,#18201f 8px 100%);border:2px solid #345b45;box-shadow:inset -5px -5px 10px #07100c,0 0 14px #58ff7c33}.alien .eye{position:absolute;left:19px;top:9px;width:7px;height:7px;border-radius:50%;background:#87ff67;box-shadow:0 0 8px #79ff58,0 0 14px #79ff58}.alien .leg{position:absolute;width:16px;height:4px;background:#31463b;border-radius:6px;top:20px;transform-origin:left center}.alien .l1{left:5px;transform:rotate(32deg)}.alien .l2{left:6px;top:24px;transform:rotate(14deg)}.alien .r1{right:5px;transform:rotate(148deg);transform-origin:right center}.alien .r2{right:5px;top:24px;transform:rotate(166deg);transform-origin:right center}.alien .horn{position:absolute;left:2px;top:4px;border-style:solid;border-width:4px 10px 4px 0;border-color:transparent #506e52 transparent transparent;transform:rotate(18deg)}.player{width:32px;height:38px;z-index:6;filter:drop-shadow(0 0 10px rgba(76,223,255,.26))}.player .pack{position:absolute;left:1px;top:11px;width:9px;height:18px;border-radius:4px;background:#13212f;border:1px solid #365b6b;box-shadow:inset 0 0 6px #00cfff55}.player .body{position:absolute;left:8px;top:10px;width:17px;height:22px;border-radius:5px 5px 7px 7px;background:linear-gradient(145deg,#273746,#101922);border:1px solid #507185}.player .helmet{position:absolute;left:8px;top:0;width:18px;height:15px;border-radius:9px 9px 5px 5px;background:linear-gradient(145deg,#394d5d,#151d25);border:1px solid #69839a}.player .visor{position:absolute;left:12px;top:5px;width:11px;height:4px;border-radius:5px;background:#50e8ff;box-shadow:0 0 7px #50e8ff,0 0 12px #50e8ff88}.player .arm{position:absolute;right:1px;top:14px;width:11px;height:5px;border-radius:4px;background:#1a2833;transform:rotate(-15deg)}.player .blaster{position:absolute;right:-5px;top:13px;width:12px;height:4px;border-radius:2px;background:#8aa1ae;box-shadow:4px 0 5px #46e9ff}.player .leg{position:absolute;bottom:0;width:6px;height:9px;border-radius:0 0 3px 3px;background:#111a21}.player .leg.a{left:10px}.player .leg.b{right:7px}.exit{width:58px;height:58px;border-radius:50%;border:3px solid #64f4ff;box-shadow:0 0 24px #64f4ff88,inset 0 0 22px #64f4ff44;background:radial-gradient(circle,#163d47 0 18%,#0a161d 19% 48%,#15424f 49% 53%,#081219 54%)}.exit:after{content:"";position:absolute;inset:8px;border:1px solid #8df7ff88;border-radius:50%;animation:spin 7s linear infinite}.exit.locked{border-color:#5d6f80;box-shadow:none;opacity:.5;filter:grayscale(.8)}.msg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(88%,560px);padding:10px 14px;border-radius:9px;background:#040a12ef;border:1px solid #27577a;color:#dbeeff;text-align:center;font-size:.9rem;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 0 22px #000}.msg.show{opacity:1}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:12px auto 0}.btn{min-height:52px;border:1px solid #355d91;border-radius:10px;background:linear-gradient(#15233c,#0b1322);color:#eefbff;font-weight:900;font-size:1.1rem;touch-action:none;user-select:none}.btn.action{background:linear-gradient(#412855,#21152c);border-color:#8d57ad;box-shadow:inset 0 0 12px #8d57ad22}.legend{text-align:center;color:#8193a7;font-size:.8rem;margin:10px 0}.back{display:inline-block;margin:4px 0 12px;color:#a8e8ff;text-decoration:none;font-weight:700}@keyframes pulse{50%{transform:rotate(45deg) scale(1.18);filter:brightness(1.25)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:680px){body{padding:6px}.top{align-items:flex-start}.hud{gap:5px}.pill{min-width:68px;padding:6px}.title p{font-size:.67rem}.game-shell{padding:5px;border-radius:12px}.controls{gap:6px}.btn{min-height:50px;font-size:1rem}.legend{font-size:.72rem}}</style></head><body><main class="wrap"><div class="top"><div class="title"><h1>NEON RUINS</h1><p>Explore the dead sector · recover alien power cores · survive</p></div><div class="hud"><div class="pill"><span>Suit Integrity</span><b id="health">100</b></div><div class="pill"><span>Alien Cores</span><b id="cores">0 / 3</b></div><div class="pill"><span>Mission</span><b id="obj">Explore</b></div></div></div><div class="game-shell"><div class="viewport" id="viewport"><div class="world" id="world"><div class="wall" style="left:0;top:0;width:1600px;height:34px"></div><div class="wall" style="left:0;top:966px;width:1600px;height:34px"></div><div class="wall" style="left:0;top:0;width:34px;height:1000px"></div><div class="wall" style="left:1566px;top:0;width:34px;height:1000px"></div><div class="wall" style="left:290px;top:180px;width:360px;height:48px"></div><div class="wall" style="left:290px;top:180px;width:48px;height:310px"></div><div class="wall" style="left:610px;top:180px;width:40px;height:310px"></div><div class="wall" style="left:290px;top:450px;width:140px;height:40px"></div><div class="wall" style="left:510px;top:450px;width:140px;height:40px"></div><div class="gate" id="gate" style="left:430px;top:450px;height:40px"></div><div class="wall" style="left:850px;top:90px;width:50px;height:450px"></div><div class="wall" style="left:850px;top:500px;width:330px;height:40px"></div><div class="wall" style="left:1140px;top:500px;width:40px;height:290px"></div><div class="wall" style="left:1040px;top:750px;width:140px;height:40px"></div><div class="ruin" style="left:70px;top:650px;width:250px;height:220px"></div><div class="ruin" style="left:1270px;top:150px;width:210px;height:180px"></div><div class="pillar" style="left:715px;top:110px"></div><div class="pillar" style="left:1230px;top:620px"></div><div class="spore" style="left:180px;top:620px"></div><div class="spore" style="left:1210px;top:180px"></div><div class="spore" style="left:1430px;top:670px"></div><div class="core" data-core style="left:525px;top:300px"></div><div class="core" data-core style="left:1010px;top:270px"></div><div class="core" data-core style="left:1370px;top:730px"></div><div class="npc" id="npc" style="left:175px;top:720px"></div><div class="alien" data-drone style="left:760px;top:300px"><i class="body"></i><i class="eye"></i><i class="horn"></i><i class="leg l1"></i><i class="leg l2"></i><i class="leg r1"></i><i class="leg r2"></i></div><div class="alien" data-drone style="left:990px;top:650px"><i class="body"></i><i class="eye"></i><i class="horn"></i><i class="leg l1"></i><i class="leg l2"></i><i class="leg r1"></i><i class="leg r2"></i></div><div class="alien" data-drone style="left:1340px;top:410px"><i class="body"></i><i class="eye"></i><i class="horn"></i><i class="leg l1"></i><i class="leg l2"></i><i class="leg r1"></i><i class="leg r2"></i></div><div class="exit locked" id="exit" style="left:1450px;top:850px"></div><div class="player" id="player" style="left:90px;top:90px"><i class="pack"></i><i class="body"></i><i class="helmet"></i><i class="visor"></i><i class="arm"></i><i class="blaster"></i><i class="leg a"></i><i class="leg b"></i></div></div><div class="msg" id="msg"></div></div></div><div class="controls"><button class="btn" data-dir="left">◀</button><button class="btn" data-dir="up">▲</button><button class="btn action" id="action">ACT</button><button class="btn" data-dir="down">▼</button><button class="btn" data-dir="right">▶</button></div><div class="legend">PC: WASD / Arrow Keys to move · E or Space to interact/fire · Mobile: use the controls above</div><a class="back" href="games.html">← Back to Portfolio Arcade</a></main><script>(()=>{const world=document.getElementById('world'),view=document.getElementById('viewport'),p=document.getElementById('player'),msg=document.getElementById('msg'),gate=document.getElementById('gate'),exit=document.getElementById('exit'),healthEl=document.getElementById('health'),coresEl=document.getElementById('cores'),objEl=document.getElementById('obj');let x=90,y=90,health=100,cores=0,won=false,lastHit=0;const speed=4.2,keys={};const walls=[...document.querySelectorAll('.wall'),gate];const drones=[...document.querySelectorAll('[data-drone]')].map(el=>({el,x:parseFloat(el.style.left),y:parseFloat(el.style.top),hp:2}));function box(nx,ny){return{x:nx,y:ny,w:32,h:38}}function rect(el){return{x:parseFloat(el.style.left),y:parseFloat(el.style.top),w:parseFloat(el.style.width)||el.offsetWidth,h:parseFloat(el.style.height)||el.offsetHeight}}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function blocked(nx,ny){const b=box(nx,ny);return walls.some(w=>w===gate&&gate.classList.contains('open')?false:hit(b,rect(w)))}function say(t){msg.textContent=t;msg.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>msg.classList.remove('show'),2200)}function collect(){document.querySelectorAll('[data-core]').forEach(c=>{if(c.style.display==='none')return;if(hit(box(x,y),rect(c))){c.style.display='none';cores++;coresEl.textContent=cores+' / 3';say('Alien power core secured.');if(cores===3){gate.classList.add('open');exit.classList.remove('locked');objEl.textContent='Reach Ring';say('All cores synchronized. Transit ring unlocked.')}}})}function act(){let closeNpc=Math.hypot(x-175,y-720)<70;if(closeNpc){say(cores<3?'Mara: The ruins react to three alien cores. Find them before the creatures find you.':'Mara: The ring is awake. Get out of this sector.');return}for(const d of drones){if(d.hp>0&&Math.hypot(x-d.x,y-d.y)<72){d.hp--;d.el.style.filter='brightness(2.6) drop-shadow(0 0 14px #48eaff)';setTimeout(()=>d.el.style.filter='',130);if(d.hp<=0){d.el.style.opacity='.25';d.el.style.transform='scale(.7) rotate(22deg)';setTimeout(()=>d.el.style.display='none',180);say('Alien neutralized.')}return}}if(cores===3&&Math.hypot(x-1450,y-850)<82){won=true;objEl.textContent='Complete';say('SECTOR RESTORED // TRANSIT RING ACTIVE');exit.style.boxShadow='0 0 48px #64f4ff, inset 0 0 28px #64f4ff';return}say('Scanner finds nothing useful here.')}function move(dx,dy){if(won)return;let nx=x+dx*speed,ny=y+dy*speed;if(!blocked(nx,y))x=nx;if(!blocked(x,ny))y=ny;p.style.left=x+'px';p.style.top=y+'px';collect()}function updateDrones(){const now=performance.now();for(const d of drones){if(d.hp<=0)continue;let dist=Math.hypot(x-d.x,y-d.y);if(dist<300){let dx=(x-d.x)/dist,dy=(y-d.y)/dist,spd=1.35;let nx=d.x+dx*spd,ny=d.y+dy*spd;if(!blocked(nx,ny)){d.x=nx;d.y=ny;d.el.style.left=d.x+'px';d.el.style.top=d.y+'px';d.el.style.transform=`rotate(${Math.sin(now/180)*5}deg)`}if(dist<38&&now-lastHit>900){health=Math.max(0,health-15);healthEl.textContent=health;lastHit=now;p.style.filter='brightness(2.4) drop-shadow(0 0 12px #ff556a)';setTimeout(()=>p.style.filter='',120);if(health<=0){health=100;healthEl.textContent=100;x=90;y=90;p.style.left=x+'px';p.style.top=y+'px';say('Explorer suit rebooted at the sector entrance.')}}}}}function camera(){let vw=view.clientWidth,vh=view.clientHeight;let cx=Math.max(0,Math.min(1600-vw,x-vw/2)),cy=Math.max(0,Math.min(1000-vh,y-vh/2));world.style.transform=`translate(${-cx}px,${-cy}px)`}function loop(){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){let n=Math.hypot(dx,dy);move(dx/n,dy/n)}updateDrones();camera();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};if(m[k]){keys[m[k]]=true;e.preventDefault()}if(k==='e'||e.code==='Space'){e.preventDefault();act()}});document.addEventListener('keyup',e=>{const k=e.key.toLowerCase(),m={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};if(m[k])keys[m[k]]=false});document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[d]=true;b.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>keys[d]=false))});document.getElementById('action').addEventListener('pointerdown',e=>{e.preventDefault();act()});say('Mission: recover three alien power cores. Mara is somewhere in the southwest ruins.');loop()})();</script></body></html>
