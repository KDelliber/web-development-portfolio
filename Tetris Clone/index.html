<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tetris</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:8px;background:#101318;color:#fff;font-family:Arial,sans-serif;text-align:center;overscroll-behavior:none;transition:background-color .35s ease}h1{margin:2px 0 4px}#stats{display:flex;justify-content:center;gap:18px;font-size:18px;margin-bottom:6px}#gameArea{display:flex;justify-content:center;align-items:flex-start;gap:14px}#game{border:3px solid #fff;background:#05070a;width:min(300px,52vw);height:auto;max-height:58vh;touch-action:none;box-shadow:0 0 0 2px #000 inset}#holdArea,#nextArea{font-size:16px;font-weight:bold}#hold,#next{width:90px;height:90px;border:3px solid #fff;background:#05070a;margin-top:4px}#desktopControls{margin-top:8px;color:#ddd;font-size:14px}#mobileControls{display:grid;grid-template-columns:repeat(3,minmax(70px,110px));gap:8px;justify-content:center;max-width:360px;margin:10px auto 0;touch-action:none}.control-btn{min-height:52px;padding:8px;border:2px solid #fff;border-radius:10px;background:#262626;color:#fff;font-size:18px;font-weight:bold;user-select:none;-webkit-user-select:none;touch-action:none}.control-btn:active{background:#555;transform:scale(.98)}.wide-btn{grid-column:span 3}.restart-btn{margin-top:8px;padding:9px 18px;font-size:16px}.back-link{display:inline-block;margin-top:8px;color:#fff}#squareStats{margin-top:6px;color:#ddd;font-size:13px}@media(max-width:600px){body{padding:4px 6px 8px}h1{font-size:26px}#stats{font-size:15px;gap:10px}#gameArea{gap:6px}#game{width:min(50vw,230px);max-height:none}#hold,#next{width:58px;height:58px;border-width:2px}#holdArea,#nextArea{font-size:12px}#desktopControls{font-size:12px}.control-btn{min-height:48px}}@media(max-width:390px){#game{width:48vw}#hold,#next{width:52px;height:52px}#mobileControls{grid-template-columns:repeat(3,minmax(64px,1fr))}}
</style>
</head>
<body>
<h1>TETRIS</h1>
<div id="stats"><span id="score">Score: 0</span><span id="lines">Lines: 0</span><span id="level">Level: 1</span></div>
<div id="gameArea"><div id="holdArea"><div>HOLD</div><canvas id="hold" width="120" height="120"></canvas></div><canvas id="game" width="300" height="600"></canvas><div id="nextArea"><div>NEXT</div><canvas id="next" width="120" height="120"></canvas></div></div>
<div id="squareStats">Silver squares: <span id="silverCount">0</span> &nbsp; Gold squares: <span id="goldCount">0</span></div>
<div id="mobileControls" aria-label="Tetris touch controls"><button class="control-btn" id="holdBtn">HOLD</button><button class="control-btn" id="rotateLeftBtn">↺</button><button class="control-btn" id="rotateRightBtn">↻</button><button class="control-btn" id="leftBtn">◀</button><button class="control-btn" id="downBtn">▼</button><button class="control-btn" id="rightBtn">▶</button><button class="control-btn wide-btn" id="hardDropBtn">HARD DROP</button></div>
<button class="restart-btn" onclick="restartGame()">Restart</button>
<div id="desktopControls">Keyboard: ← → Move &nbsp; | &nbsp; A/D Rotate &nbsp; | &nbsp; W Hold &nbsp; | &nbsp; ↓ Drop &nbsp; | &nbsp; Space Hard Drop</div>
<a class="back-link" href="../games.html">← Back to Games</a><p style="color:#ddd;font-size:12px">&copy; 2026 Kenneth Delliber Jr. All rights reserved.</p>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),nextCanvas=document.getElementById('next'),nextCtx=nextCanvas.getContext('2d'),holdCanvas=document.getElementById('hold'),holdCtx=holdCanvas.getContext('2d');
const COLS=10,ROWS=20,BLOCK=30;
const pieces=[[[1,1,1,1]],[[2,0,0],[2,2,2]],[[0,0,3],[3,3,3]],[[4,4],[4,4]],[[0,5,5],[5,5,0]],[[0,6,0],[6,6,6]],[[7,7,0],[0,7,7]]];
// Okabe-Ito inspired, high-contrast palettes. Shape markings also identify pieces without relying only on color.
const palettes=[
[null,'#56B4E9','#0072B2','#E69F00','#F0E442','#009E73','#CC79A7','#D55E00'],
[null,'#8FD3FF','#3A86FF','#FFB000','#FFF176','#00BFA6','#E08CFF','#FF6B35'],
[null,'#67E8F9','#2563EB','#F59E0B','#FDE047','#10B981','#D946EF','#F97316'],
[null,'#7DD3FC','#1D4ED8','#FB923C','#FACC15','#14B8A6','#C084FC','#EF4444'],
[null,'#A5F3FC','#60A5FA','#FDBA74','#FEF08A','#5EEAD4','#E879F9','#FB7185']
];
const themes=[
{page:'#101318',board:'#05070a'},
{page:'#111827',board:'#08111f'},
{page:'#1a1324',board:'#100917'},
{page:'#102021',board:'#071313'},
{page:'#21170f',board:'#140d07'}
];
let board,score,totalLines,level,nextType,currentType,holdType,canHold,gameOver,lastDrop=0,pieceSerial=0,silverCount=0,goldCount=0,dropInterval=700;
const player={matrix:null,x:0,y:0,type:null,pieceId:null};
const scoreEl=document.getElementById('score'),linesEl=document.getElementById('lines'),levelEl=document.getElementById('level'),silverEl=document.getElementById('silverCount'),goldEl=document.getElementById('goldCount');
function colors(){return palettes[(level-1)%palettes.length]}function theme(){return themes[(level-1)%themes.length]}
function applyLevelTheme(){const t=theme();document.body.style.backgroundColor=t.page;canvas.style.backgroundColor=t.board;holdCanvas.style.backgroundColor=t.board;nextCanvas.style.backgroundColor=t.board}
function createBoard(){return Array.from({length:ROWS},()=>Array(COLS).fill(null))}
function updateStats(){scoreEl.textContent='Score: '+score;linesEl.textContent='Lines: '+totalLines;levelEl.textContent='Level: '+level;silverEl.textContent=silverCount;goldEl.textContent=goldCount}
function recalcLevel(){const old=level;level=Math.floor(totalLines/10)+1;dropInterval=Math.max(90,700-(level-1)*60);if(level!==old)applyLevelTheme()}
function spawnType(type){currentType=type;player.type=type;player.pieceId=++pieceSerial;player.matrix=pieces[type].map(r=>[...r]);player.y=0;player.x=Math.floor(COLS/2)-Math.floor(player.matrix[0].length/2);if(collision())gameOver=true}
function newPiece(){const type=nextType;nextType=Math.floor(Math.random()*pieces.length);canHold=true;spawnType(type);drawNextPiece()}
function drawPattern(c,x,y,size,v){c.save();c.strokeStyle='rgba(0,0,0,.72)';c.fillStyle='rgba(255,255,255,.45)';c.lineWidth=Math.max(2,size*.08);const p=size*.22,mid=size/2;if(v===1){c.beginPath();c.moveTo(x+p,y+size-p);c.lineTo(x+size-p,y+p);c.stroke()}else if(v===2){c.beginPath();c.moveTo(x+p,y+mid);c.lineTo(x+size-p,y+mid);c.stroke()}else if(v===3){c.beginPath();c.moveTo(x+mid,y+p);c.lineTo(x+mid,y+size-p);c.stroke()}else if(v===4){c.fillRect(x+mid-size*.09,y+mid-size*.09,size*.18,size*.18)}else if(v===5){c.strokeRect(x+p,y+p,size-2*p,size-2*p)}else if(v===6){c.beginPath();c.arc(x+mid,y+mid,size*.16,0,Math.PI*2);c.stroke()}else if(v===7){c.beginPath();c.moveTo(x+p,y+p);c.lineTo(x+size-p,y+size-p);c.moveTo(x+size-p,y+p);c.lineTo(x+p,y+size-p);c.stroke()}c.restore()}
function drawPreview(c,cv,type){const t=theme();c.fillStyle=t.board;c.fillRect(0,0,cv.width,cv.height);if(type==null)return;const m=pieces[type],pb=25,ox=(cv.width-m[0].length*pb)/2,oy=(cv.height-m.length*pb)/2;m.forEach((r,y)=>r.forEach((v,x)=>{if(v){const px=ox+x*pb,py=oy+y*pb;c.fillStyle=colors()[v];c.fillRect(px,py,pb,pb);c.strokeStyle='#fff';c.lineWidth=1.5;c.strokeRect(px+.75,py+.75,pb-1.5,pb-1.5);drawPattern(c,px,py,pb,v)}}))}
function drawNextPiece(){drawPreview(nextCtx,nextCanvas,nextType)}function drawHoldPiece(){drawPreview(holdCtx,holdCanvas,holdType)}
function holdPiece(){if(gameOver||!canHold)return;canHold=false;if(holdType==null){holdType=currentType;const t=nextType;nextType=Math.floor(Math.random()*pieces.length);spawnType(t);drawNextPiece()}else{const t=holdType;holdType=currentType;spawnType(t)}drawHoldPiece()}
function drawCell(x,y,cell,alpha=1){ctx.save();ctx.globalAlpha=alpha;const px=x*BLOCK,py=y*BLOCK;ctx.fillStyle=cell.square==='gold'?'#F2C94C':cell.square==='silver'?'#C9D1D9':colors()[cell.value];ctx.fillRect(px,py,BLOCK,BLOCK);ctx.strokeStyle='#fff';ctx.lineWidth=cell.square?2.5:1.5;ctx.strokeRect(px+1,py+1,BLOCK-2,BLOCK-2);ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(px+3,py+3,BLOCK-6,BLOCK-6);if(!cell.square)drawPattern(ctx,px,py,BLOCK,cell.value);ctx.restore()}
function ghostY(){let gy=player.y;while(true){gy++;if(collision(player.matrix,player.x,gy)){gy--;break}}return gy}
function draw(){ctx.fillStyle=theme().board;ctx.fillRect(0,0,canvas.width,canvas.height);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(board[y][x])drawCell(x,y,board[y][x]);if(!gameOver&&player.matrix){const gy=ghostY();player.matrix.forEach((r,y)=>r.forEach((v,x)=>{if(v)drawCell(player.x+x,gy+y,{value:v,square:null},.28)}));player.matrix.forEach((r,y)=>r.forEach((v,x)=>{if(v)drawCell(player.x+x,player.y+y,{value:v,square:null})}))}if(gameOver){ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='32px Arial';ctx.textAlign='center';ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2)}}
function collision(matrix=player.matrix,px=player.x,py=player.y){for(let y=0;y<matrix.length;y++)for(let x=0;x<matrix[y].length;x++){if(!matrix[y][x])continue;const nx=px+x,ny=py+y;if(nx<0||nx>=COLS||ny>=ROWS)return true;if(ny>=0&&board[ny][nx])return true}return false}
function mergePiece(){player.matrix.forEach((r,y)=>r.forEach((v,x)=>{if(v&&player.y+y>=0)board[player.y+y][player.x+x]={value:v,type:player.type,pieceId:player.pieceId,square:null}}))}
function wholePieceIds(){const map=new Map();for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const c=board[y][x];if(c&&!c.square){if(!map.has(c.pieceId))map.set(c.pieceId,[]);map.get(c.pieceId).push({x,y,c})}}return map}
function detectSquares(){const pieceMap=wholePieceIds();for(let sy=0;sy<=ROWS-4;sy++)for(let sx=0;sx<=COLS-4;sx++){const cells=[];let full=true;for(let y=sy;y<sy+4;y++)for(let x=sx;x<sx+4;x++){const c=board[y][x];if(!c||c.square){full=false;break}else cells.push({x,y,c})}if(!full||cells.length!==16)continue;const ids=[...new Set(cells.map(o=>o.c.pieceId))];if(ids.length!==4)continue;let valid=true;for(const id of ids){const all=pieceMap.get(id)||[];if(all.length!==4||!all.every(o=>o.x>=sx&&o.x<sx+4&&o.y>=sy&&o.y<sy+4)){valid=false;break}}if(!valid)continue;const types=[...new Set(ids.map(id=>(pieceMap.get(id)||[])[0]?.c.type))],kind=types.length===1?'gold':'silver';cells.forEach(o=>o.c.square=kind);if(kind==='gold'){goldCount++;score+=1000}else{silverCount++;score+=500}updateStats();return true}return false}
function clearLines(){let cleared=0;for(let y=ROWS-1;y>=0;y--){if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(COLS).fill(null));y++;cleared++}}if(cleared){const pts=[0,100,300,500,800];score+=pts[cleared]*level;totalLines+=cleared;recalcLevel();updateStats();drawNextPiece();drawHoldPiece()}}
function lockAndContinue(){mergePiece();while(detectSquares()){}clearLines();newPiece()}
function drop(){if(gameOver)return;player.y++;if(collision()){player.y--;lockAndContinue()}}function hardDrop(){if(gameOver)return;player.y=ghostY();lockAndContinue()}function move(d){if(gameOver)return;player.x+=d;if(collision())player.x-=d}
function rotateMatrix(clockwise){if(gameOver)return;const old=player.matrix,rot=clockwise?old[0].map((_,i)=>old.map(r=>r[i]).reverse()):old[0].map((_,i)=>old.map(r=>r[r.length-1-i])),ox=player.x;player.matrix=rot;for(const k of [0,-1,1,-2,2]){player.x=ox+k;if(!collision())return}player.x=ox;player.matrix=old}
function rotate(){rotateMatrix(true)}function rotateLeft(){rotateMatrix(false)}
function restartGame(){board=createBoard();score=0;totalLines=0;level=1;dropInterval=700;gameOver=false;holdType=null;canHold=true;pieceSerial=0;silverCount=0;goldCount=0;nextType=Math.floor(Math.random()*pieces.length);lastDrop=performance.now();applyLevelTheme();drawHoldPiece();newPiece();updateStats()}
const held={left:false,right:false,down:false},repeatState={left:0,right:0,down:0};function setHeld(key,state){held[key]=state;if(state)repeatState[key]=performance.now()+150}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(e.key)||e.code==='Space')e.preventDefault();if(e.repeat)return;if(e.key==='ArrowLeft'){move(-1);setHeld('left',true)}else if(e.key==='ArrowRight'){move(1);setHeld('right',true)}else if(e.key==='ArrowDown'){drop();setHeld('down',true)}else if(k==='d')rotate();else if(k==='a')rotateLeft();else if(k==='w')holdPiece();else if(e.code==='Space')hardDrop();draw()});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')setHeld('left',false);if(e.key==='ArrowRight')setHeld('right',false);if(e.key==='ArrowDown')setHeld('down',false)});
function bindTap(id,fn){document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();fn();draw()})}function bindRepeat(id,fn,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);fn();setHeld(key,true)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>setHeld(key,false)))}
bindRepeat('leftBtn',()=>move(-1),'left');bindRepeat('rightBtn',()=>move(1),'right');bindRepeat('downBtn',drop,'down');bindTap('rotateLeftBtn',rotateLeft);bindTap('rotateRightBtn',rotate);bindTap('holdBtn',holdPiece);bindTap('hardDropBtn',hardDrop);
function update(time=0){for(const key of ['left','right','down'])if(held[key]&&time>=repeatState[key]){if(key==='left')move(-1);else if(key==='right')move(1);else drop();repeatState[key]=time+(key==='down'?45:55)}if(!gameOver&&time-lastDrop>dropInterval){drop();lastDrop=time}draw();requestAnimationFrame(update)}restartGame();update();
</script>
</body>
</html>
